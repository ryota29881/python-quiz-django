{% load static %}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pythonの知識を楽しく学べるクイズアプリ">
    <link rel="stylesheet" href="{% static 'quiz/style.css' %}">
    <title>{% block title %}Pythonクイズ{% endblock %}</title>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <h1>
                <a href="{% url 'home' %}" class="site-title">PYTHON LEARNING QUIZ</a>
            </h1>
            <nav class="header-nav" aria-label="メインナビゲーション">
                {% if user.is_authenticated %}
                    <span class="welcome-user">{{ user.username }} さん</span>
                    <a href="{% url 'history' %}">マイページ</a>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="nav-button">ログアウト</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">ログイン</a>
                    <a href="{% url 'register' %}">新規登録</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
