{% extends "quiz/base.html" %}

{% block title %}
新規登録
{% endblock %}

{% block content %}

<div class="quiz-card auth-card">

    <h1>新規登録</h1>

    <p>アカウントを作成してクイズの成績を保存しましょう。</p>

    <form method="post" class="auth-form">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">登録する</button>

    </form>

    <p>
        すでにアカウントをお持ちの場合は、
        <a href="{% url 'login' %}">ログイン</a>
        してください。
    </p>

    <p>
        <a href="{% url 'home' %}">タイトルへ戻る</a>
    </p>

</div>

{% endblock %}
